name: Autoformat strict check-in fix

on:
  push:
    branches: [fix/ci-truthful-reporting]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ci-truthful-reporting

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: uv sync --dev --frozen

      - name: Apply reviewed Bandit suppressions and Ruff formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('strict_checkin.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import subprocess\n',
              'import subprocess  # nosec B404 - fixed local interpreter invocation only\n',
              1,
          )
          text = text.replace(
              'process = subprocess.Popen(  # noqa: S603\n',
              'process = subprocess.Popen(  # nosec B603 - fixed argv, shell=False\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format strict_checkin.py tests/test_strict_checkin.py
          git diff --check

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strict_checkin.py tests/test_strict_checkin.py
          git commit -m "Format strict check-in code and document Bandit suppressions"
          git push origin HEAD:fix/ci-truthful-reporting
