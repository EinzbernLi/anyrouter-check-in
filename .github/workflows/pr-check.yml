name: PR Quality Checks

on:
  pull_request:
    branches: [main, master, workflow]
  push:
    branches: [workflow]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 缓存 UV 依赖
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-dev-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-dev-

      - name: 安装依赖
        run: uv sync --dev --frozen

      - name: 代码风格检查 (Ruff Lint)
        id: ruff-lint
        run: |
          echo "## Ruff Lint 检查" >> "$GITHUB_STEP_SUMMARY"
          set +e
          uv run ruff check . --output-format=github 2>&1 | tee ruff-lint.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ 代码风格检查通过" >> "$GITHUB_STEP_SUMMARY"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 代码风格检查失败，请查看详细日志" >> "$GITHUB_STEP_SUMMARY"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: 代码格式检查 (Ruff Format)
        id: ruff-format
        run: |
          echo "## Ruff Format 检查" >> "$GITHUB_STEP_SUMMARY"
          set +e
          uv run ruff format --check . 2>&1 | tee ruff-format.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ 代码格式检查通过" >> "$GITHUB_STEP_SUMMARY"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 代码格式检查失败，请运行 \`ruff format .\`" >> "$GITHUB_STEP_SUMMARY"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: 类型检查 (MyPy)
        id: mypy
        run: |
          echo "## MyPy 类型检查" >> "$GITHUB_STEP_SUMMARY"
          set +e
          uv run mypy . --ignore-missing-imports 2>&1 | tee mypy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ 类型检查通过" >> "$GITHUB_STEP_SUMMARY"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 类型检查存在问题，请查看详细日志" >> "$GITHUB_STEP_SUMMARY"
            echo "status=warning" >> "$GITHUB_OUTPUT"
          fi

      - name: 安全扫描 (Bandit)
        id: bandit
        run: |
          echo "## Bandit 安全扫描" >> "$GITHUB_STEP_SUMMARY"
          set +e
          uv run bandit -r . -c pyproject.toml 2>&1 | tee bandit.log
          code=${PIPESTATUS[0]}
          uv run bandit -r . -c pyproject.toml -f json -o bandit-report.json >/dev/null 2>&1
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ 安全扫描通过" >> "$GITHUB_STEP_SUMMARY"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Bandit 发现潜在安全问题，请查看 bandit.log" >> "$GITHUB_STEP_SUMMARY"
            echo "status=warning" >> "$GITHUB_OUTPUT"
          fi

      - name: 运行测试 (Pytest)
        id: pytest
        run: |
          echo "## Pytest 测试" >> "$GITHUB_STEP_SUMMARY"
          set +e
          uv run pytest tests/ -v --cov=. --cov-report=term --cov-report=xml --cov-report=html 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ 所有测试通过" >> "$GITHUB_STEP_SUMMARY"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 测试失败，请查看详细日志" >> "$GITHUB_STEP_SUMMARY"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传覆盖率到 Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-anyrouter-check-in
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 生成检查报告
        if: always()
        id: generate-report
        run: |
          {
            echo "REPORT<<EOF"
            echo "# 🔍 PR 代码质量检查报告"
            echo
            echo "## 检查结果总览"
            echo
            [ "${{ steps.ruff-lint.outputs.status }}" = "success" ] && echo "✅ **代码风格检查 (Ruff Lint)**: 通过" || echo "❌ **代码风格检查 (Ruff Lint)**: 失败"
            [ "${{ steps.ruff-format.outputs.status }}" = "success" ] && echo "✅ **代码格式检查 (Ruff Format)**: 通过" || echo "❌ **代码格式检查 (Ruff Format)**: 失败"
            [ "${{ steps.mypy.outputs.status }}" = "success" ] && echo "✅ **类型检查 (MyPy)**: 通过" || echo "⚠️ **类型检查 (MyPy)**: 有警告"
            [ "${{ steps.bandit.outputs.status }}" = "success" ] && echo "✅ **安全扫描 (Bandit)**: 通过" || echo "⚠️ **安全扫描 (Bandit)**: 发现警告"
            [ "${{ steps.pytest.outputs.status }}" = "success" ] && echo "✅ **测试 (Pytest)**: 通过" || echo "❌ **测试 (Pytest)**: 失败"
            echo
            echo "## 🔧 修复建议"
            echo
            if [ "${{ steps.ruff-lint.outputs.status }}" != "success" ] || [ "${{ steps.ruff-format.outputs.status }}" != "success" ]; then
              echo "- 运行 \`uv run ruff check . --fix\` 和 \`uv run ruff format .\`。"
            fi
            if [ "${{ steps.mypy.outputs.status }}" != "success" ]; then
              echo "- MyPy 当前有类型警告；请查看 workflow 日志。"
            fi
            if [ "${{ steps.bandit.outputs.status }}" != "success" ]; then
              echo "- Bandit 当前有安全警告；必须查看具体 finding 后再决定修复或有依据地抑制。"
            fi
            if [ "${{ steps.pytest.outputs.status }}" != "success" ]; then
              echo "- Pytest 失败；请检查测试日志。"
            fi
            echo
            echo "---"
            echo "*本报告由 GitHub Actions 自动生成；状态来自工具真实退出码。*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 发布检查报告到 PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = `${{ steps.generate-report.outputs.REPORT }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('PR 代码质量检查报告')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: 最终状态检查
        if: always()
        run: |
          if [ "${{ steps.ruff-lint.outputs.status }}" != "success" ] || \
             [ "${{ steps.ruff-format.outputs.status }}" != "success" ] || \
             [ "${{ steps.pytest.outputs.status }}" != "success" ]; then
            echo "❌ 关键质量检查未通过"
            exit 1
          fi
          if [ "${{ steps.mypy.outputs.status }}" != "success" ]; then
            echo "⚠️ MyPy 有警告，但暂不阻止 PR 合并"
          fi
          if [ "${{ steps.bandit.outputs.status }}" != "success" ]; then
            echo "⚠️ Bandit 有警告，必须人工审查 finding"
          fi
          echo "✅ 关键质量检查通过"
